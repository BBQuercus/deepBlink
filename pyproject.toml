[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "deepblink"
version = "0.2.0"
description = "Threshold independent detection and localization of diffraction-limited spots."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Bastian Eichenberger", email = "bastian@eichenbergers.ch"},
    {name = "YinXiu Zhan", email = "yinxiuzhan89@gmail.com"},
]
keywords = ["deep-learning", "biomedical", "image analysis", "spot detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Utilities",
]
dependencies = [
    "keras>=3.8",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml",
    "requests",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
napari = ["napari[all]>=0.4.19"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "hypothesis",
]

[project.scripts]
deepblink = "deepblink.cli:main"

[project.urls]
Homepage = "https://github.com/bbquercus/deepblink/"
Documentation = "https://github.com/BBQuercus/deepBlink/wiki"
Changelog = "https://github.com/BBQuercus/deepBlink/releases"
"Issue Tracker" = "https://github.com/bbquercus/deepblink/issues"

[tool.setuptools.packages.find]
include = ["deepblink*"]

[tool.setuptools.package-data]
"deepblink.cli" = ["models.txt"]

[tool.pytest.ini_options]
norecursedirs = ["migrations"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra --strict-markers --tb=short"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "D"]
ignore = [
    "E203",
    "E402",
    "E501",
    "D107",    # missing docstring in __init__ (matches old pydocstyle config)
    "D102",    # missing docstring in public method
    "D105",    # missing docstring in magic method
    "UP007",   # use X | Y for union types (keep for older style)
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
