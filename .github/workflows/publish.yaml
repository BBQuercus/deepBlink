name: publish

# Builds the noarch conda package from conda/meta.yaml and uploads it to the
# anaconda.org account that owns ANACONDA_TOKEN. Runs on a published release.
# A pull request that touches the recipe or this file builds without upload;
# a manual run uploads only with upload=true.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - "conda/**"
      - ".github/workflows/publish.yaml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to anaconda.org"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"
          channels: conda-forge
      # conda-build is a plugin of conda itself, so it goes into the base environment
      - name: Install build tools
        run: conda install -n base -y conda-build anaconda-client
      - name: Build
        run: conda build conda --output-folder dist
      - name: Upload
        if: github.event_name == 'release' || inputs.upload
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: anaconda upload --skip-existing "$(conda build conda --output --output-folder dist)"
